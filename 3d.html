<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Teste 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; font-family: system-ui, sans-serif; touch-action: none; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; color: #fff; text-shadow: 0 1px 3px #000a; font-size: 14px; pointer-events: none; }
  #hpbox { width: 220px; height: 16px; background: #0008; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 2px solid #fff8; }
  #hp { height: 100%; width: 100%; background: linear-gradient(#7ef07e, #3fbf3f); transition: width .1s; }
  #ajuda { position: fixed; right: 12px; top: 12px; background: #0007; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 260px; }
  #ajuda b { color: #fde68a; }
  #voltar { position: fixed; left: 12px; bottom: 12px; background: #0008; color: #fff; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); color: #fff; font-size: 28px; font-weight: 700; text-shadow: 0 2px 6px #000; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #stick { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: #fff2; border: 2px solid #fff6; display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: #fff8; }
  #dashbtn { position: fixed; right: 24px; bottom: 32px; width: 84px; height: 84px; border-radius: 50%; background: #0007; border: 2px solid #fff8; color: #fff; font-weight: 700; display: none; align-items: center; justify-content: center; font-size: 15px; }
  body.touch #dashbtn { display: flex; }
  body.touch #ajuda { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hud">
  <div id="hpbox"><div id="hp"></div></div>
  <div id="info"></div>
</div>
<div id="ajuda">
  <b>Teste 3D</b> — Pokémon 3D da Pokemon-3D-api.<br>
  <b>WASD</b> andar · <b>mouse</b> mirar · <b>clique</b> atirar<br>
  <b>Espaço</b> esquiva · <b>Q/E</b> girar câmera · <b>roda</b> zoom<br>
  Controle: analógicos, <b>RT</b> atira, <b>A</b> esquiva, <b>LB/RB</b> câmera
</div>
<a id="voltar" href="index.html">← Voltar ao jogo</a>
<div id="msg"></div>
<div id="stick"><div id="knob"></div></div>
<div id="dashbtn">Esquiva</div>
<script type="module" src="js3d/cena.js?v=3"></script>
</body>
</html>
